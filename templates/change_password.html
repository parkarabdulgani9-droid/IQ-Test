<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Prologic IQ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>
    <div class="container">
        <div class="page-brand">
             <span class="brand-name">PROLOGIC</span>
             <span class="brand-iq">IQ</span>
        </div>
        <h1>Change Password</h1>
        <p>Update your account password</p>
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
        <form method="POST">
            <input type="password" name="current_password" placeholder="Current Password" required>
            <input type="password" name="new_password" placeholder="New Password" required>
            <input type="password" name="confirm_password" placeholder="Confrim new password" required>
            <button type="submit">UPDATE PASSWORD</button>
        </form>
        <a href="{{ url_for('dashboard') }}" class="settings-button">Back to Dashboard</a>
    </div>
</body>
</html>
